<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="270" viewBox="0 0 1110 270">
  <defs>
    <filter id="fine-cut" x="-5%" y="-5%" width="110%" height="110%">
      <feMorphology in="SourceAlpha" operator="erode" radius="1.2" result="slender"/>
      <feComposite in="SourceGraphic" in2="slender" operator="in"/>
    </filter>
    <filter id="carved-metal" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="erode" radius="1.2" result="shape"/>
      <feComposite in="SourceGraphic" in2="shape" operator="in" result="face"/>
      <feGaussianBlur in="shape" stdDeviation="1.1" result="surface"/>
      <feSpecularLighting in="surface" surfaceScale="7" specularConstant="1.1" specularExponent="18" lighting-color="#fff5d6" result="reflection">
        <feDistantLight azimuth="225" elevation="48"/>
      </feSpecularLighting>
      <feComposite in="reflection" in2="shape" operator="in" result="bevel"/>
      <feComposite in="face" in2="bevel" operator="arithmetic" k1="0" k2="1" k3=".9" k4="0"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="10" x2="0" y2="245" gradientUnits="userSpaceOnUse">
