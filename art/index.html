<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Paintings and pastel studies by Harshit Muhal."
    />
    <title>Paintings | Harshit Muhal</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <a class="skip-link" href="#collection">Skip to paintings</a>
    <header class="gallery-nav">
      <a class="artist-name" href="../index.html">Harshit Muhal</a>
      <nav aria-label="Gallery navigation">
        <a href="../index.html"
          ><span aria-hidden="true">&larr;</span> Portfolio</a
        >
        <a
          href="https://drive.google.com/drive/folders/1zb3IL89Wx6IhjD_OZHTBvy6QEeVTK3r_?usp=sharing"
          target="_blank"
          rel="noopener noreferrer"
          >Open in Drive <span aria-hidden="true">&nearr;</span></a
        >
      </nav>
    </header>
    <main id="collection" aria-labelledby="gallery-title">
      <div class="gallery-heading">
        <h1 id="gallery-title">Paintings <em>&amp; studies</em></h1>
        <p class="gallery-tagline">
          Sometimes, I put the keyboard aside and pick up a paintbrush.
        </p>
      </div>
      <div class="gallery-frame">
        <iframe
          src="https://drive.google.com/embeddedfolderview?id=1zb3IL89Wx6IhjD_OZHTBvy6QEeVTK3r_#grid"
          title="Harshit Muhal's paintings — Google Drive gallery"
          aria-describedby="gallery-fallback"
          loading="eager"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>
      <p class="gallery-fallback" id="gallery-fallback">
        Select a painting for its full-size preview, or scroll within the
        collection for more. If it doesn't load,
        <a
          href="https://drive.google.com/drive/folders/1zb3IL89Wx6IhjD_OZHTBvy6QEeVTK3r_?usp=sharing"
          target="_blank"
          rel="noopener noreferrer"
          >view the paintings in Google Drive.</a
        >
      </p>
    </main>
  </body>
</html>
